<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <main>

        <div id="taskScreen">
            <p id="output"></p>
            <div>
                <input id="problem" type="text" placeholder="">
            </div>
        </div>
        
        <div id="history">

        </div>

        <div id="calc">
            
            <div id="firstRow">
                <button id="raisedTo">^</button>
                <button id="number7">7</button>
                <button id="number8">8</button>
                <button id="number9">9</button>
                <button id="divide">/</button>
            </div>
            
            <div id="secondRow">
                <button id="parenthesis">()</button>
                <button id="number4">4</button>
                <button id="number5">5</button>
                <button id="number6">6</button>
                <button id="times">*</button>
            </div>
            
            <div id="thirdRow">
                <button id="pi">π</button>
                <button id="number1">1</button>
                <button id="number2">2</button>
                <button id="number3">3</button>
                <button id="minus">-</button>
            </div>
            
            <div id="fourthRow">
                <button id="root">√</button>
                <button id="comma">,</button>
                <button id="number0">0</button>
                <button id="swapMinus">(+/-)</button>
                <button id="plus">+</button>
            </div>
            
            <div id="fifthRow">
                <button id="equal">Enter</button>
            </div>
        </div>

    </main>
</body>
</html>
